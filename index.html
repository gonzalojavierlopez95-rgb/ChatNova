  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Convierte bloques ```codigo``` en tarjetas tappeables que abren el visor de archivo
  let archivosGenerados = [];
  let archivoAbiertoIndice = null;

  // ---- Markdown liviano para las respuestas de Nova: **negrita**, *cursiva*, `código`,
  // títulos, listas, citas, tablas y links. Todo se escapa primero, así que es seguro.
  function inlineMd(s) {
    const codigos = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => {
      codigos.push(c);
      return "\u0000" + (codigos.length - 1) + "\u0000";
    });
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\s][^_\n]*?)_(?!\w)/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"']+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codigos[i] + "</code>");
    return s;
  }

  function renderListaMd(items) {
    let out = "";
    const pila = [];
    items.forEach((it) => {
      while (pila.length && it.indent < pila[pila.length - 1].indent) {
        out += "</li></" + pila.pop().tipo + ">";
      }
      if (!pila.length || it.indent > pila[pila.length - 1].indent) {
        const inicio = it.tipo === "ol" && it.num !== 1 ? ' start="' + it.num + '"' : "";
        out += "<" + it.tipo + inicio + ">";
        pila.push({ indent: it.indent, tipo: it.tipo });
      } else {
        out += "</li>";
      }
      out += "<li>" + inlineMd(it.texto).replace(/\n/g, "<br>");
    });
    while (pila.length) out += "</li></" + pila.pop().tipo + ">";
    return out;
  }

  function celdasTabla(linea) {
    let t = linea.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map((c) => c.trim());
  }

  function markdownAHtml(texto) {
    const lineas = escapeHtml(texto).replace(/\r\n?/g, "\n").split("\n");
    const reItemUl = /^(\s*)[-*+]\s+(.*)$/;
    const reItemOl = /^(\s*)(\d+)[.)]\s+(.*)$/;
    const reSepTabla = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
    let html = "";
    let parrafo = [];
    let i = 0;
    const cerrarParrafo = () => {
      if (parrafo.length) {
        html += "<p>" + parrafo.map(inlineMd).join("<br>") + "</p>";
        parrafo = [];
      }
    };
    const esItem = (l) => reItemUl.test(l) || reItemOl.test(l);

    while (i < lineas.length) {
      const l = lineas[i];
      if (!l.trim()) { cerrarParrafo(); i++; continue; }

      let m = l.match(/^\s{0,3}(#{1,4})\s+(.*)$/);
      if (m) {
        cerrarParrafo();
        const n = m[1].length;
        html += "<h" + n + ">" + inlineMd(m[2]) + "</h" + n + ">";
        i++; continue;
      }

      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)) {
        cerrarParrafo();
        html += "<hr>";
        i++; continue;
      }

      if (/^\s{0,3}&gt;/.test(l)) {
        cerrarParrafo();
        const citas = [];
        while (i < lineas.length && /^\s{0,3}&gt;/.test(lineas[i])) {
          citas.push(inlineMd(lineas[i].replace(/^\s{0,3}&gt;\s?/, "")));
          i++;
        }
        html += "<blockquote>" + citas.join("<br>") + "</blockquote>";
        continue;
      }

      if (l.trim().startsWith("|") && i + 1 < lineas.length && reSepTabla.test(lineas[i + 1]) && lineas[i + 1].includes("|")) {
        cerrarParrafo();
        const cab = celdasTabla(l);
        i += 2;
        let filas = "";
        while (i < lineas.length && lineas[i].trim() && lineas[i].includes("|")) {
          filas += "<tr>" + celdasTabla(lineas[i]).map((c) => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>";
          i++;
        }
        html += '<div class="tabla-wrap"><table><thead><tr>' +
          cab.map((c) => "<th>" + inlineMd(c) + "</th>").join("") +
          "</tr></thead><tbody>" + filas + "</tbody></table></div>";
        continue;
      }

      if (esItem(l)) {
        cerrarParrafo();
        const items = [];
        while (i < lineas.length) {
          const li = lineas[i];
          let mm;
          if ((mm = li.match(reItemUl))) {
            items.push({ indent: mm[1].length, tipo: "ul", num: 1, texto: mm[2] });
            i++;
          } else if ((mm = li.match(reItemOl))) {
            items.push({ indent: mm[1].length, tipo: "ol", num: parseInt(mm[2], 10), texto: mm[3] });
            i++;
          } else if (!li.trim()) {
            // línea en blanco: la lista sigue si lo próximo también es un ítem
            let j = i + 1;
            while (j < lineas.length && !lineas[j].trim()) j++;
            if (j < lineas.length && esItem(lineas[j])) { i = j; } else { break; }
          } else if (/^\s{2,}\S/.test(li) && items.length) {
            items[items.length - 1].texto += "\n" + li.trim();
            i++;
          } else {
            break;
          }
        }
        html += renderListaMd(items);
        continue;
      }

      parrafo.push(l);
      i++;
    }
    cerrarParrafo();
    return html;
  }

  function tituloTarjeta(nombre) {
    const base = nombre.replace(/\.[^.]+$/, "");
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function renderContenido(texto, esBot) {
    const partes = texto.split(/```(\w*)\n?([\s\S]*?)```/g);
    let html = "";
    for (let i = 0; i < partes.length; i += 3) {
      if (partes[i]) html += esBot ? markdownAHtml(partes[i]) : escapeHtml(partes[i]);
      if (partes[i + 2] !== undefined) {
        const lenguaje = (partes[i + 1] || "").toLowerCase();
        const codigo = partes[i + 2];
        const indice = archivosGenerados.length;
        archivosGenerados.push({ codigo, lenguaje });
        const ext = EXT_POR_LENGUAJE[lenguaje] || "txt";
        const nombre = nombreArchivo(lenguaje, ext);
        html += `<div class="archivo-card" onclick="abrirArchivoModal(${indice})">
          <div class="archivo-card-icono">&lt;/&gt;</div>
          <div class="archivo-card-info">
            <div class="archivo-card-titulo">${escapeHtml(tituloTarjeta(nombre))}</div>
            <div class="archivo-card-subtitulo">Código · ${ext.toUpperCase()}</div>
          </div>
        </div>`;
      }
    }
    return html;
  }

  const EXT_POR_LENGUAJE = {
    js: "js", javascript: "js", jsx: "jsx", ts: "ts", typescript: "ts", tsx: "tsx",
    py: "py", python: "py", html: "html", htm: "html", css: "css", json: "json",
    java: "java", c: "c", cpp: "cpp", "c++": "cpp", cs: "cs", csharp: "cs",
    php: "php", rb: "rb", ruby: "rb", go: "go", golang: "go", rust: "rs", rs: "rs",
    sh: "sh", bash: "sh", shell: "sh", zsh: "sh", yaml: "yaml", yml: "yaml",
    sql: "sql", xml: "xml", md: "md", markdown: "md", txt: "txt", text: "txt", swift: "swift", kt: "kt", kotlin: "kt",
  };

  const NOMBRE_BASE_POR_LENGUAJE = {
    html: "index", htm: "index", css: "estilos", json: "datos", sql: "consulta",
    sh: "script", bash: "script", yaml: "config", yml: "config", xml: "datos", md: "documento", txt: "memoria", text: "memoria",
  };

  function nombreArchivo(lenguaje, ext) {
    const base = NOMBRE_BASE_POR_LENGUAJE[lenguaje] || "script";
    return `${base}.${ext}`;
  }

  function abrirArchivoModal(indice) {
    const archivo = archivosGenerados[indice];
    if (!archivo) return;
    archivoAbiertoIndice = indice;
    const ext = EXT_POR_LENGUAJE[archivo.lenguaje] || "txt";
    document.getElementById("archivoTitulo").innerText = nombreArchivo(archivo.lenguaje, ext);
    document.getElementById("archivoCodigo").innerText = archivo.codigo;
    document.getElementById("overlayArchivo").classList.add("abierto");
  }

  function cerrarArchivoModal() {
    document.getElementById("overlayArchivo").classList.remove("abierto");
  }

  function copiarArchivoModal(btn) {
    const archivo = archivosGenerados[archivoAbiertoIndice];
    if (!archivo) return;
    navigator.clipboard.writeText(archivo.codigo);
    const original = btn.innerText;
    btn.innerText = "¡Copiado!";
    setTimeout(() => (btn.innerText = original), 1500);
  }

  function descargarArchivoModal(btn) {
    const archivo = archivosGenerados[archivoAbiertoIndice];
    if (!archivo) return;
    const ext = EXT_POR_LENGUAJE[archivo.lenguaje] || "txt";
    const nombre = nombreArchivo(archivo.lenguaje, ext);
    const blob = new Blob([archivo.codigo], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    const original = btn.innerText;
    btn.innerText = "¡Listo!";
    setTimeout(() => (btn.innerText = original), 1500);
  }

  // ---- Adjuntos (cámara / archivos, estilo ChatGPT) ----

  function toggleAttachMenu() {
    document.getElementById("attachMenu").classList.toggle("abierto");
    document.getElementById("attachOverlay").classList.toggle("abierto");
  }
  function cerrarAttachMenu() {
    document.getElementById("attachMenu").classList.remove("abierto");
    document.getElementById("attachOverlay").classList.remove("abierto");
  }

  const EXT_TEXTO = [".txt", ".md", ".js", ".jsx", ".ts", ".tsx", ".py", ".json", ".html", ".css", ".csv", ".java", ".c", ".cpp", ".cs", ".php", ".rb", ".go", ".rs", ".sh", ".yml", ".yaml", ".sql", ".xml"];
  function esTextoPorNombre(nombre) {
    return EXT_TEXTO.some((ext) => nombre.toLowerCase().endsWith(ext));
  }

  // Redimensiona/comprime la imagen en el navegador antes de mandarla (más rápido y liviano)
  function comprimirImagen(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1568;
          let { width, height } = img;
          if (width > MAX || height > MAX) {
            if (width > height) {
              height = Math.round((height * MAX) / width);
              width = MAX;
            } else {
              width = Math.round((width * MAX) / height);
              height = MAX;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function leerComoTexto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  function leerComoBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function manejarArchivoSeleccionado(event) {
    const archivos = Array.from(event.target.files || []);
    for (const file of archivos) {
      if (file.size > 15 * 1024 * 1024) {
        alert(`"${file.name}" pesa más de 15MB, es demasiado grande.`);
        continue;
      }
      try {
        if (file.type.startsWith("image/")) {
          const base64 = await comprimirImagen(file);
          adjuntosPendientes.push({ tipo: "image", nombre: file.name, mediaType: "image/jpeg", data: base64 });
        } else if (file.type === "application/pdf") {
          const base64 = await leerComoBase64(file);
          adjuntosPendientes.push({ tipo: "document", nombre: file.name, mediaType: "application/pdf", data: base64 });
        } else if (file.type.startsWith("text/") || esTextoPorNombre(file.name)) {
          const texto = await leerComoTexto(file);
          adjuntosPendientes.push({ tipo: "text", nombre: file.name, contenido: texto });
        } else {
          alert(`No puedo leer "${file.name}" (tipo no soportado). Probá con imagen, PDF o archivo de texto/código.`);
        }
      } catch (err) {
        alert(`Error leyendo "${file.name}": ` + err.message);
      }
    }
    event.target.value = "";
    renderizarAdjuntosPendientes();
  }

  function renderizarAdjuntosPendientes() {
    const cont = document.getElementById("adjuntos-preview");
    cont.innerHTML = "";
    adjuntosPendientes.forEach((adj, i) => {
      const chip = document.createElement("div");
      chip.className = "adjunto-chip";
      if (adj.tipo === "image") {
        chip.innerHTML = `<img src="data:${adj.mediaType};base64,${adj.data}" /><span>${escapeHtml(adj.nombre)}</span><span class="quitar" onclick="quitarAdjunto(${i})">✕</span>`;
      } else {
        chip.innerHTML = `<span>📄 ${escapeHtml(adj.nombre)}</span><span class="quitar" onclick="quitarAdjunto(${i})">✕</span>`;
      }
      cont.appendChild(chip);
    });
    actualizarBotonEnviar();
  }

  function quitarAdjunto(i) {
    adjuntosPendientes.splice(i, 1);
    renderizarAdjuntosPendientes();
  }

  // Alterna el botón único: micrófono para hablar si no hay nada escrito, flecha para enviar si hay texto o adjuntos
  function actualizarBotonEnviar() {
    if (reconociendo) return; // no interferir mientras está grabando el dictado manual
    const btn = document.getElementById("sendBtn");
    const hayContenido = inputEl.value.trim().length > 0 || adjuntosPendientes.length > 0;
    if (hayContenido) {
      btn.innerHTML = ICONO_ENVIAR;
      btn.onclick = enviar;
    } else {
      btn.innerHTML = ICONO_MIC;
      btn.onclick = toggleMic;
    }
  }

  // ---- Voz: micrófono (hablar) y síntesis (Nova responde hablando) ----

  let reconociendo = false;
  let recognition = null;
  let modoConversacion = false;
  let novaHablando = false;

  function toggleMic() {
    if (modoConversacion) {
      alert("Ya estás en modo Charla — hablá directamente, no hace falta tocar el micrófono.");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Tu navegador no soporta reconocimiento de voz. Probá con Chrome (en Brave puede venir bloqueado por privacidad).");
      return;
    }
    if (reconociendo) {
      recognition && recognition.stop();
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = "es-AR";
    recognition.continuous = false;
    recognition.interimResults = true;

    const textoBase = inputEl.value ? inputEl.value + " " : "";
    reconociendo = true;
    document.getElementById("sendBtn").classList.add("escuchando");
    setEstadoNova("escuchando");

    recognition.onresult = (event) => {
      let final = "";
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      inputEl.value = textoBase + final + interim;
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    };
    recognition.onend = () => {
      reconociendo = false;
      document.getElementById("sendBtn").classList.remove("escuchando");
      setEstadoNova("reposo");
      actualizarBotonEnviar();
    };
    recognition.onerror = (e) => {
      reconociendo = false;
      document.getElementById("sendBtn").classList.remove("escuchando");
      setEstadoNova("reposo");
      actualizarBotonEnviar();
      if (e.error !== "no-speech" && e.error !== "aborted") {
        alert("Error de reconocimiento de voz: " + e.error);
      }
    };
    recognition.start();
  }

  let vozActivada = JSON.parse(localStorage.getItem("nova_voz_activada") || "true");

  function actualizarBotonVoz() {
    const btn = document.getElementById("voiceToggleBtn");
    if (!btn) return;
    btn.innerHTML = vozActivada ? ICONO_VOZ_ON : ICONO_VOZ_OFF;
    btn.classList.toggle("activo", vozActivada);
  }

  function toggleVoz() {
    vozActivada = !vozActivada;
    localStorage.setItem("nova_voz_activada", JSON.stringify(vozActivada));
    actualizarBotonVoz();
    if (!vozActivada && "speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  function textoParaHablar(contenido) {
    let texto = typeof contenido === "string" ? contenido : contenido.filter((b) => b.type === "text").map((b) => b.text).join(" ");
    return texto.replace(/```[\s\S]*?```/g, " bloque de código, revisá la pantalla. ").trim();
  }

  function hablar(contenido, alTerminar) {
    if (!vozActivada || !("speechSynthesis" in window)) {
      setEstadoNova(modoConversacion ? "escuchando" : "reposo");
      if (alTerminar) alTerminar();
      return;
    }
    const texto = textoParaHablar(contenido);
    if (!texto) {
      setEstadoNova(modoConversacion ? "escuchando" : "reposo");
      if (alTerminar) alTerminar();
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(texto);
    utter.lang = "es-AR";
    novaHablando = true;
    setEstadoNova("hablando");
    if (modoConversacion) document.getElementById("estadoConversacion").innerText = "Nova está hablando...";
    utter.onend = () => {
      novaHablando = false;
      setEstadoNova(modoConversacion ? "escuchando" : "reposo");
      if (alTerminar) alTerminar();
    };
    utter.onerror = () => {
      novaHablando = false;
      setEstadoNova(modoConversacion ? "escuchando" : "reposo");
      if (alTerminar) alTerminar();
    };
    window.speechSynthesis.speak(utter);
  }

  // ---- Modo Charla: ida y vuelta por voz, sin tocar nada ----

  // ---- Cámara en vivo: queda prendida mientras hablás, y se manda un frame con cada mensaje ----

  function toggleModoConversacion() {
    modoConversacion = !modoConversacion;
    const estado = document.getElementById("estadoConversacion");
    if (modoConversacion) {
      cerrarMenuOpciones();
      if (!vozActivada) {
        vozActivada = true;
        localStorage.setItem("nova_voz_activada", JSON.stringify(true));
        actualizarBotonVoz();
      }
      iniciarEscuchaConversacion();
    } else {
      if (recognition) recognition.stop();
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      document.getElementById("sendBtn").classList.remove("escuchando");
      estado.innerText = "";
      setEstadoNova("reposo");
    }
    actualizarBotonCharla();
  }

  function iniciarEscuchaConversacion() {
    if (!modoConversacion || novaHablando) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Tu navegador no soporta reconocimiento de voz. Probá con Chrome.");
      toggleModoConversacion();
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = "es-AR";
    recognition.continuous = false;
    recognition.interimResults = true;

    document.getElementById("sendBtn").classList.add("escuchando");
    document.getElementById("estadoConversacion").innerText = "Escuchando...";
    setEstadoNova("escuchando");

    let transcripcionFinal = "";

    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) transcripcionFinal += t;
        else interim += t;
      }
      inputEl.value = (transcripcionFinal + " " + interim).trim();
    };

    recognition.onend = () => {
      document.getElementById("sendBtn").classList.remove("escuchando");
      if (!modoConversacion) return;
      const texto = transcripcionFinal.trim();
      if (texto) {
        document.getElementById("estadoConversacion").innerText = "";
        enviar();
      } else {
        setTimeout(iniciarEscuchaConversacion, 500);
      }
    };

    recognition.onerror = (e) => {
      document.getElementById("sendBtn").classList.remove("escuchando");
      if (!modoConversacion) return;
      if (e.error === "no-speech" || e.error === "aborted") {
        setTimeout(iniciarEscuchaConversacion, 500);
      } else {
        document.getElementById("estadoConversacion").innerText = "Error de micrófono: " + e.error;
      }
    };

    recognition.start();
  }

  // Convierte contenido (string simple, o array de bloques texto/imagen/documento) a HTML para mostrar en el chat
  function contenidoARenderHtml(contenido, esBot) {
    if (typeof contenido === "string") return renderContenido(contenido, esBot);
    let html = "";
    contenido.forEach((b) => {
      if (b.type === "text") html += renderContenido(b.text, esBot);
      else if (b.type === "image") html += `<img class="msg-img" src="data:${b.source.media_type};base64,${b.source.data}" />`;
      else if (b.type === "document") html += `<div class="msg-doc-chip">📄 PDF adjunto</div>`;
    });
    return html;
  }

  // Arma la lista de "pasos" a partir de los bloques que devuelve la API (búsquedas web, razonamiento, herramientas)
  function extraerPasos(bloques) {
    const pasos = [];
    const porId = {};
    (Array.isArray(bloques) ? bloques : []).forEach((b) => {
      if (!b || typeof b !== "object") return;
      if (b.type === "thinking" || b.type === "redacted_thinking") {
        pasos.push({ titulo: "Razonó" });
      } else if (b.type === "server_tool_use" || b.type === "tool_use") {
        const entrada = b.input || {};
        const detalle = entrada.query || entrada.url || entrada.command || "";
        let titulo;
        if (b.name === "web_search") titulo = "Buscó en la web";
        else if (b.name === "web_fetch") titulo = "Abrió una página";
        else titulo = "Usó " + (b.name || "una herramienta");
        const paso = { titulo: titulo, detalle: String(detalle).slice(0, 140) };
        pasos.push(paso);
        if (b.id) porId[b.id] = paso;
      } else if (b.type === "web_search_tool_result") {
        const paso = porId[b.tool_use_id];
        if (paso && Array.isArray(b.content)) {
          paso.resultado = b.content.length + (b.content.length === 1 ? " resultado" : " resultados");
        }
      }
    });
    return pasos;
  }

  function pasosHtml(pasos) {
    if (!Array.isArray(pasos) || !pasos.length) return "";
    const items = pasos.map((p) => {
      const detalle = [p.detalle, p.resultado].filter(Boolean).map(escapeHtml).join(" — ");
      return '<div class="paso">' + escapeHtml(p.titulo) + (detalle ? '<span class="detalle">' + detalle + "</span>" : "") + "</div>";
    }).join("");
    const etiqueta = pasos.length + (pasos.length === 1 ? " paso" : " pasos");
    return '<div class="pasos"><button type="button" class="pasos-toggle" onclick="this.parentElement.classList.toggle(\'abierto\')">' +
      "<span>" + etiqueta + '</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>' +
      '<div class="pasos-lista">' + items + "</div></div>";
  }

  function actualizarBotonBajar() {
    const btn = document.getElementById("btnBajar");
    if (!btn) return;
    const distancia = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
    btn.classList.toggle("visible", distancia > 160);
  }

  function bajarAlFinal() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: "smooth" });
  }

  // opciones.alInicio: si la respuesta es más larga que la pantalla, se muestra desde su primera línea (como en Claude)
  function agregarMensaje(rol, contenido, pasos, opciones) {
    const fila = document.createElement("div");
    fila.className = "fila " + (rol === "user" ? "user" : rol === "error" ? "aviso" : "bot");

    if (rol === "error") {
      const dots = document.createElement("div");
      dots.className = "typing-dots avatar-dots";
      dots.innerHTML = "<span></span><span></span><span></span>";
      fila.appendChild(dots);
    }

    const div = document.createElement("div");
    div.className = "msg " + (rol === "user" ? "user" : rol === "error" ? "error" : "bot");
    if (rol === "error") {
      div.innerHTML = escapeHtml(contenido);
    } else {
      div.innerHTML = (rol === "bot" ? pasosHtml(pasos) : "") + contenidoARenderHtml(contenido, rol === "bot");
    }
    fila.appendChild(div);

    messagesEl.appendChild(fila);
    if (opciones && opciones.alInicio && fila.offsetHeight > messagesEl.clientHeight * 0.85) {
      messagesEl.scrollTop = Math.max(0, fila.offsetTop - 12);
    } else {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    actualizarBotonBajar();
    return fila;
  }

  function pintarHistorialCompleto() {
    messagesEl.innerHTML = "";
    historial.forEach((m, i) => agregarMensaje(m.role === "user" ? "user" : "bot", m.content, pasosPorIndice[i]));
    messagesEl.scrollTop = messagesEl.scrollHeight;
    actualizarBotonBajar();
  }

  function quitarFilaTyping(fila) {
    if (!fila) return;
    const orb = fila.querySelector(".nova-orb");
    if (orb) orb.classList.add("orb-saliendo");
    // sale del flujo enseguida (así la respuesta nueva no se corre) y se borra cuando termina la animación
    fila.style.position = "absolute";
    fila.style.pointerEvents = "none";
    setTimeout(() => fila.remove(), 280);
  }

  function limpiarChat() {
    if (!confirm("¿Borrar todo el historial de esta conversación?")) return;
    historial = [];
    pasosPorIndice = {};
    const conv = conversaciones.find((c) => c.id === conversacionActivaId);
    if (conv) conv.titulo = "Nueva conversación";
    guardarHistorial();
    messagesEl.innerHTML = "";
  }

  async function enviar() {
    const texto = inputEl.value.trim();
    if (!texto && adjuntosPendientes.length === 0) return;

    let contenidoUsuario;
    if (adjuntosPendientes.length > 0) {
      contenidoUsuario = [];
      if (texto) contenidoUsuario.push({ type: "text", text: texto });
      adjuntosPendientes.forEach((adj) => {
        if (adj.tipo === "image") {
          contenidoUsuario.push({ type: "image", source: { type: "base64", media_type: adj.mediaType, data: adj.data } });
        } else if (adj.tipo === "document") {
          contenidoUsuario.push({ type: "document", source: { type: "base64", media_type: adj.mediaType, data: adj.data } });
        } else if (adj.tipo === "text") {
          contenidoUsuario.push({ type: "text", text: `Archivo adjunto "${adj.nombre}":\n\`\`\`\n${adj.contenido}\n\`\`\`` });
        }
      });
      if (!texto) contenidoUsuario.unshift({ type: "text", text: "(ver adjunto)" });
    } else {
      contenidoUsuario = texto;
    }

    agregarMensaje("user", contenidoUsuario);
    historial.push({ role: "user", content: contenidoUsuario });
    guardarHistorial();
    inputEl.value = "";
    inputEl.style.height = "auto";
    adjuntosPendientes = [];
    renderizarAdjuntosPendientes();
    sendBtn.disabled = true;
    setEstadoNova("pensando");

    const filaTyping = document.createElement("div");
    filaTyping.className = "fila typing";
    filaTyping.innerHTML = `<div class="nova-orb-wrap"><span class="nova-orb"></span></div>`;
    messagesEl.appendChild(filaTyping);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: historial, modelo: modeloActual, esfuerzo: esfuerzoActual }),
      });
      const data = await res.json();
      quitarFilaTyping(filaTyping);

      if (data.error) {
        setEstadoNova(modoConversacion ? "escuchando" : "reposo");
        agregarMensaje("error", "Error: " + (data.error.message || JSON.stringify(data.error)));
        if (modoConversacion) iniciarEscuchaConversacion();
      } else {
        const bloquesTexto = (data.content || []).filter((b) => b.type === "text");
        const respuesta = bloquesTexto.length ? bloquesTexto.map((b) => b.text).join("\n\n") : "(sin respuesta)";
        const pasos = extraerPasos(data.content);
        agregarMensaje("bot", respuesta, pasos, { alInicio: true });
        const traeCodigo = /```/.test(respuesta);
        const continuarConVoz = () => {
          hablar(respuesta, () => {
            if (modoConversacion) iniciarEscuchaConversacion();
          });
        };
        if (traeCodigo) {
          // Nova "terminó de escribir" el código: un instante visual antes de seguir
          setEstadoNova("codigo");
          setTimeout(continuarConVoz, 850);
        } else {
          continuarConVoz();
        }
        historial.push({ role: "assistant", content: respuesta });
        if (pasos.length) pasosPorIndice[historial.length - 1] = pasos;
        guardarHistorial();
      }
    } catch (err) {
      quitarFilaTyping(filaTyping);
      setEstadoNova(modoConversacion ? "escuchando" : "reposo");
      agregarMensaje("error", "No se pudo conectar con el Worker: " + err.message);
      if (modoConversacion) iniciarEscuchaConversacion();
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      // En el celular (pantalla táctil) Enter hace salto de línea y se envía con el botón.
      // En la compu, Enter envía y Shift+Enter hace salto de línea.
      if (window.matchMedia("(pointer: coarse)").matches) return;
      e.preventDefault();
      enviar();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    actualizarBotonEnviar();
  });

  messagesEl.addEventListener("scroll", actualizarBotonBajar, { passive: true });

  actualizarBotonVoz();
  actualizarBotonEnviar();
  actualizarBotonModelo();
  actualizarBotonEsfuerzo();
  pintarHistorialCompleto();
</script>
</body>
</html>
