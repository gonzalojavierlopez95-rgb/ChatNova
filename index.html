<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
<title>ChatNova</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/icon-192.png" />
<meta name="theme-color" content="#151515" />
<style>
  :root {
    --bg: #151515;
    --panel: #20201e;
    --border: #3d3c3a;
    --text: #f5f4f0;
    --muted: #999691;
    --accent: #5ADD13; /* verde de Nova: solo para el avatar y el orbe */
    --user-bubble: #30302e;
    --bot-bubble: #20201e;
    --code-bg: #101010;
    --btn: #5ADD13; /* verde de Nova en los botones de acción */
    --btn-text: #151515;
    --serif: "Anthropic Serif", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --mono: "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; /* la página nunca scrollea; solo #messages lo hace */
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh; /* fallback para navegadores viejos */
    height: calc(var(--vh, 1vh) * 100); /* altura real, sin la barra del navegador ni el teclado */
    height: 100dvh; /* mejor opción moderna: se ajusta sola cuando aparece el teclado o la barra */
    max-width: 780px;
    margin: 0 auto;
    overflow: hidden;
    touch-action: none;
  }
  header {
    padding: 8px 16px;
    border-bottom: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  header .titulo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar-nova-wrap {
    position: relative;
    width: 45px;
    height: 45px;
    flex-shrink: 0;
  }
  header .titulo img {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    object-fit: cover;
    background: #0a0910;
    display: block;
    transition: transform 0.25s ease;
    position: relative;
    z-index: 1;
  }
  .avatar-nova-wrap::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 15px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .avatar-nova-badge {
    position: absolute;
    bottom: -3px;
    right: -3px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .avatar-nova-badge svg { width: 8px; height: 8px; }
  /* ---- reposo: respiración sutil, Nova está ahí nomás ---- */
  .avatar-nova-wrap.estado-reposo img {
    animation: novaRespira 3.6s ease-in-out infinite;
  }
  @keyframes novaRespira {
    0%, 100% { box-shadow: 0 0 0 0 rgba(90, 221, 19, 0); }
    50% { box-shadow: 0 0 0 3px rgba(90, 221, 19, 0.10); }
  }
  /* ---- escuchando: te está prestando atención ---- */
  .avatar-nova-wrap.estado-escuchando::before {
    opacity: 1;
    background: radial-gradient(circle, rgba(90,221,19,0.22), transparent 70%);
    animation: novaPulsoAro 1.1s ease-in-out infinite;
  }
  .avatar-nova-wrap.estado-escuchando img { animation: novaEscala 1.1s ease-in-out infinite; }
  .avatar-nova-wrap.estado-escuchando .avatar-nova-badge {
    opacity: 1; transform: scale(1); color: var(--accent); border-color: var(--accent);
    animation: novaBadgeLatido 1.1s ease-in-out infinite;
  }
  @keyframes novaEscala {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  @keyframes novaPulsoAro {
    0%, 100% { transform: scale(0.94); opacity: 0.35; }
    50% { transform: scale(1.12); opacity: 0.85; }
  }
  @keyframes novaBadgeLatido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  /* ---- pensando: procesando tu pedido / generando la respuesta ---- */
  .avatar-nova-wrap.estado-pensando::before {
    opacity: 1;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: rgba(90,221,19,0.35);
    background: none;
    animation: novaGirar 0.85s linear infinite;
  }
  .avatar-nova-wrap.estado-pensando .avatar-nova-badge {
    opacity: 1; transform: scale(1); color: var(--accent); border-color: var(--accent);
  }
  .avatar-nova-wrap.estado-pensando .avatar-nova-badge span {
    animation: novaPuntitos 1.2s infinite;
  }
  @keyframes novaGirar { to { transform: rotate(360deg); } }
  /* ---- hablando: Nova te está respondiendo por voz ---- */
  .avatar-nova-wrap.estado-hablando img { animation: novaHabla 0.55s ease-in-out infinite; }
  .avatar-nova-wrap.estado-hablando::before {
    opacity: 1;
    background: radial-gradient(circle, rgba(90,221,19,0.3), transparent 70%);
    animation: novaPulsoAro 0.55s ease-in-out infinite;
  }
  .avatar-nova-wrap.estado-hablando .avatar-nova-badge {
    opacity: 1; transform: scale(1); color: var(--accent); border-color: var(--accent);
  }
  @keyframes novaHabla {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.055); }
  }
  /* ---- código: Nova está escribiendo/generando código ---- */
  .avatar-nova-wrap.estado-codigo::before {
    opacity: 1;
    border: 2px dashed rgba(90,221,19,0.55);
    background: none;
    animation: novaGirar 2.2s linear infinite;
  }
  .avatar-nova-wrap.estado-codigo .avatar-nova-badge {
    opacity: 1; transform: scale(1); color: var(--accent); border-color: var(--accent);
    animation: novaBadgeLatido 1.4s ease-in-out infinite;
  }
  @keyframes novaPuntitos {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #messagesWrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #messages {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding: 16px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .fila {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    max-width: 100%;
  }
  .fila.user {
    justify-content: flex-end;
  }
  .fila.bot {
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
  }
  .fila.aviso {
    align-items: center;
  }
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    flex-shrink: 0;
    object-fit: cover;
    margin-top: 2px;
    background: #0a0910;
  }
  .avatar-dots {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    justify-content: center;
    margin-top: 2px;
    padding: 0;
  }
  .msg {
    line-height: 1.5;
    font-size: 15.5px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user {
    max-width: 82%;
    padding: 10px 16px;
    border-radius: 20px;
    background: var(--user-bubble);
    white-space: pre-wrap;
  }
  .msg.bot {
    max-width: 100%;
    padding: 0;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.62;
    white-space: normal;
  }
  .msg.error {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    background: #3a1a1a;
    color: #ff9d9d;
    font-size: 13px;
    margin: 0 auto;
    white-space: pre-wrap;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  pre code {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 13px;
    white-space: pre;
  }
  .archivo-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1d1a15;
    border: 1px solid #45443f;
    border-radius: 16px;
    padding: 16px 18px;
    margin: 14px 0;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.3;
  }
  .archivo-card:active {
    background: #26211a;
  }
  .archivo-card-icono {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: var(--accent);
    color: #0f0e13;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 17px;
    flex-shrink: 0;
  }
  .archivo-card-info {
    flex: 1;
    min-width: 0;
  }
  .archivo-card-titulo {
    font-weight: 500;
    font-size: 17px;
    color: #fbfaf8;
  }
  .archivo-card-subtitulo {
    color: #c3c3bb;
    font-size: 14px;
    margin-top: 4px;
  }
  .overlay-archivo {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 40;
    display: none;
    flex-direction: column;
  }
  .overlay-archivo.abierto {
    display: flex;
  }
  .archivo-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .archivo-header button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
  }
  .archivo-header-titulo {
    flex: 1;
    font-weight: 700;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .archivo-codigo-wrap {
    flex: 1;
    overflow: auto;
    padding: 14px 16px;
  }
  .archivo-codigo-wrap pre {
    margin: 0;
    background: none;
    border: none;
    padding: 0;
  }
  .archivo-footer {
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .archivo-footer button {
    flex: 1;
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    border-radius: 14px;
    padding: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .archivo-footer button.secundario {
    background: var(--bot-bubble);
    color: var(--text);
    border: 1px solid var(--border);
  }
  #areaEntrada {
    position: relative;
    margin: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #inputBar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    margin-bottom: 0;
  }
  #inputBar textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 18px 20px 6px;
    font-size: 16px;
    font-family: inherit;
    max-height: 140px;
  }
  #inputBar textarea::placeholder {
    color: var(--muted);
  }
  #inputBar textarea:focus {
    outline: none;
  }
  #inputControls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 28px 28px;
  }
  .espaciador-flex {
    flex: 1;
  }
  .mic-send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--btn);
    color: var(--btn-text);
    transition: transform 0.1s ease;
  }
  .mic-send-btn:active {
    transform: scale(0.92);
  }
  .mic-send-btn:disabled {
    opacity: 0.5;
  }
  .voice-flat-btn {
    background: var(--user-bubble);
    border: none;
    color: var(--muted);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .voice-flat-btn.activo {
    color: var(--accent);
  }
  .attach-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 40;
    display: none;
  }
  .attach-overlay.abierto { display: block; }
  .attach-menu {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    display: none;
    flex-direction: column;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.45);
    z-index: 41;
    max-width: 780px;
    margin: 0 auto;
    transform: translateY(105%);
    transition: transform 0.22s ease;
  }
  .attach-menu.abierto {
    display: flex;
    transform: translateY(0);
  }
  .attach-menu-handle {
    width: 36px;
    height: 4px;
    border-radius: 3px;
    background: var(--border);
    margin: 0 auto 10px;
  }
  .attach-menu-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 16px;
  }
  .attach-menu-header .titulo-menu {
    font-weight: 700;
    font-size: 16px;
  }
  .attach-menu-header .cerrar-menu {
    position: absolute;
    left: 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .attach-menu-opciones {
    display: flex;
    gap: 10px;
  }
  .attach-menu-opciones button {
    flex: 1;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 16px;
    padding: 16px 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .attach-menu-opciones button:active {
    background: var(--user-bubble);
  }
  .attach-menu-opciones .icono-opcion {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }
  #adjuntos-preview {
    display: flex;
    gap: 8px;
    padding: 0 12px;
    flex-wrap: wrap;
  }
  .adjunto-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 8px;
    font-size: 12px;
    max-width: 160px;
  }
  .adjunto-chip img {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 6px;
  }
  .adjunto-chip span:not(.quitar) {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .adjunto-chip .quitar {
    cursor: pointer;
    color: var(--muted);
    font-weight: bold;
    padding: 0 2px;
  }
  .msg-img {
    max-width: 220px;
    border-radius: 10px;
    display: block;
    margin-top: 6px;
  }
  .msg-doc-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    margin-top: 6px;
  }
  header .header-botones {
    display: flex;
    gap: 6px;
  }
  .attach-btn {
    background: var(--user-bubble);
    border: none;
    color: var(--accent);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 26px;
    font-weight: 300;
    line-height: 1;
    padding: 0 0 2px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease;
  }
  .attach-btn:active {
    transform: scale(0.92);
  }
  .mic-send-btn.escuchando {
    background: #c0392b;
    color: white;
    animation: pulso 1.2s infinite;
  }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(192, 57, 43, 0); }
  }
  .header-botones button.activo {
    background: var(--btn);
    border-color: var(--btn);
    color: var(--btn-text);
    font-weight: 600;
  }
  .menu-opciones-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .menu-opciones {
    position: absolute;
    top: 52px;
    right: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 200px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 15;
  }
  .menu-opciones.abierto {
    display: flex;
  }
  .menu-opciones button {
    background: none;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .menu-opciones button:active {
    background: var(--user-bubble);
  }
  .menu-opciones button.peligro {
    color: #ff9d9d;
  }
  .selector-modelo-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .selector-modelo-btn {
    background: #313131;
    border: none;
    color: var(--text);
    padding: 11px 16px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }
  .selector-modelo-btn .esf {
    color: var(--muted);
    font-weight: 400;
    margin-left: 6px;
  }
  .selector-modelo-btn:active {
    background: var(--user-bubble);
  }
  .menu-modelo {
    position: absolute;
    left: 0;
    bottom: 46px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 230px;
    max-height: 60vh;
    overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 16;
  }
  .menu-modelo.abierto {
    display: flex;
  }
  .menu-modelo button {
    background: none;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .menu-modelo button:active {
    background: var(--user-bubble);
  }
  .menu-modelo button.activo {
    background: var(--user-bubble);
  }
  .menu-modelo .punto-modelo {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .menu-modelo .punto-claude {
    background: var(--accent);
  }
  .menu-modelo .punto-deepseek {
    background: #4da3ff;
  }
  .menu-modelo .etiqueta-modelo {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }
  .menu-modelo-nivel {
    display: none;
    flex-direction: column;
  }
  .menu-modelo-nivel.activo {
    display: flex;
  }
  .empresa-btn {
    background: none;
    border: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  .empresa-btn:active {
    background: var(--user-bubble);
  }
  .icono-empresa {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11.5px;
    font-weight: 700;
    color: #14121a;
    flex-shrink: 0;
  }
  .icono-empresa-claude {
    background: #D9A17B;
  }
  .icono-empresa-deepseek {
    background: #6fa8ff;
  }
  .empresa-nombre {
    flex: 1;
  }
  .flecha-empresa {
    color: var(--muted);
    font-size: 15px;
  }
  .nivel-modelos-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
    padding-bottom: 6px;
  }
  .volver-empresas-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .btn-esfuerzo-menu {
    padding: 4px 10px;
    font-size: 11.5px;
    flex-shrink: 0;
  }
  .btn-esfuerzo-menu.oculto {
    display: none;
  }
  .grupo-modelos {
    display: none;
    flex-direction: column;
  }
  .grupo-modelos.activo {
    display: flex;
  }
  #estadoConversacion {
    text-align: center;
    font-size: 12px;
    color: var(--accent);
    min-height: 16px;
    padding: 4px 0 0;
  }
  header .titulo {
    cursor: pointer;
  }
  .overlay-historial {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 30;
    display: none;
  }
  .overlay-historial.abierto {
    display: block;
  }
  .panel-historial {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 82%;
    max-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    z-index: 31;
    transform: translateX(-105%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    box-sizing: border-box;
  }
  .panel-historial.abierto {
    transform: translateX(0);
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .panel-titulo {
    font-weight: 700;
    font-size: 16px;
  }
  .cerrar-panel {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .nuevo-chat-btn {
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    border-radius: 22px;
    padding: 11px 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .lista-conversaciones {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .item-conversacion {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 8px;
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
  }
  .item-conversacion.activa {
    background: var(--user-bubble);
  }
  .item-conversacion .titulo-conv {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .item-conversacion .borrar-conv {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .vacio-conversaciones {
    color: var(--muted);
    font-size: 13px;
    padding: 10px;
  }
  .panel-memoria {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 82%;
    max-width: 320px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    z-index: 31;
    transform: translateX(105%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    box-sizing: border-box;
  }
  .panel-memoria.abierto {
    transform: translateX(0);
  }
  .agregar-nota-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .agregar-nota-wrap textarea {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    resize: none;
  }
  .item-nota {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 8px;
    border-radius: 10px;
    color: var(--text);
    font-size: 13.5px;
  }
  .item-nota .texto-nota {
    flex: 1;
    white-space: normal;
    word-break: break-word;
    line-height: 1.4;
  }
  .item-nota .borrar-conv {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .fila.typing {
    align-items: center;
  }
  .nova-orb-wrap {
    display: flex;
    align-items: center;
    height: 26px;
    padding: 4px 0;
  }
  .nova-orb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c3ff9a, var(--accent) 65%);
    animation: novaOrbPulso 1.3s ease-in-out infinite;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .nova-orb.orb-saliendo {
    opacity: 0;
    transform: scale(0.3);
  }
  @keyframes novaOrbPulso {
    0%, 100% {
      transform: scale(0.78);
      box-shadow: 0 0 0 0 rgba(90, 221, 19, 0.45);
    }
    50% {
      transform: scale(1.2);
      box-shadow: 0 0 8px 3px rgba(90, 221, 19, 0.22);
    }
  }
  .typing-dots {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.35;
    animation: typingBlink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(1) { animation-delay: 0s; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBlink {
    0%, 80%, 100% { opacity: 0.35; }
    40% { opacity: 1; }
  }
  /* ---- Texto con formato (markdown) dentro de las respuestas de Nova ---- */
  .msg.bot p { margin: 0 0 14px; }
  .msg.bot > :last-child { margin-bottom: 0; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4 {
    margin: 22px 0 8px;
    line-height: 1.3;
    font-weight: 600;
  }
  .msg.bot h1 { font-size: 1.35em; }
  .msg.bot h2 { font-size: 1.22em; }
  .msg.bot h3 { font-size: 1.1em; }
  .msg.bot h4 { font-size: 1em; }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot strong { font-weight: 600; color: #fff; }
  .msg.bot ul, .msg.bot ol { margin: 0 0 14px; padding-left: 28px; }
  .msg.bot li { margin: 7px 0; padding-left: 2px; }
  .msg.bot li > ul, .msg.bot li > ol { margin: 6px 0 4px; }
  .msg.bot li::marker { color: var(--muted); }
  .msg.bot a { color: #6ea9ed; text-decoration: underline; text-underline-offset: 2px; }
  .msg.bot blockquote {
    margin: 0 0 14px;
    padding: 2px 0 2px 14px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .msg.bot code {
    font-family: var(--mono);
    font-size: 0.8em;
    background: #262626;
    color: #6ea9ed;
    padding: 2px 7px;
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .tabla-wrap { overflow-x: auto; margin: 0 0 14px; }
  .msg.bot table {
    border-collapse: collapse;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg.bot th, .msg.bot td {
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .msg.bot th { font-weight: 600; color: #fff; white-space: nowrap; }

  /* ---- "N pasos ›": lo que hizo Nova antes de responder (búsquedas, razonamiento) ---- */
  .pasos {
    margin: 0 0 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .pasos-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 15px;
    padding: 6px 0;
    cursor: pointer;
  }
  .pasos-toggle .chev {
    width: 15px;
    height: 15px;
    transition: transform 0.15s ease;
  }
  .pasos.abierto .pasos-toggle .chev { transform: rotate(90deg); }
  .pasos-lista {
    display: none;
    margin: 2px 0 6px 7px;
    padding-left: 14px;
    border-left: 2px solid var(--border);
  }
  .pasos.abierto .pasos-lista { display: block; }
  .paso { color: var(--muted); font-size: 14.5px; padding: 5px 0; }
  .paso .detalle { display: block; font-size: 13px; color: #77746e; overflow-wrap: anywhere; }

  /* ---- Botón flotante para bajar al final ---- */
  #btnBajar {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--user-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(8px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 5;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }
  #btnBajar.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
</style>

              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </span>
            Archivo
          </button>
        </div>
      </div>
      <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display:none" onchange="manejarArchivoSeleccionado(event)" />
      <input type="file" id="inputAlbum" accept="image/*" multiple style="display:none" onchange="manejarArchivoSeleccionado(event)" />
      <input type="file" id="inputArchivo" accept="*/*" multiple style="display:none" onchange="manejarArchivoSeleccionado(event)" />
      <div class="selector-modelo-wrap" id="selectorModeloWrap">
        <button class="selector-modelo-btn" type="button" id="btnSelectorModelo" onclick="toggleSelectorModelo()">
          <span id="txtSelectorModelo">Claude</span><span class="esf" id="txtEsfuerzoPastilla"></span>
        </button>
        <div class="menu-modelo" id="menuModelo">
          <div class="menu-modelo-nivel activo" id="nivelEmpresas">
            <button type="button" class="empresa-btn" onclick="mostrarModelosEmpresa('claude')">
              <span class="icono-empresa icono-empresa-claude">A</span>
              <span class="empresa-nombre">Anthropic</span>
              <span class="flecha-empresa">›</span>
            </button>
            <button type="button" class="empresa-btn" onclick="mostrarModelosEmpresa('deepseek')">
              <span class="icono-empresa icono-empresa-deepseek">D</span>
              <span class="empresa-nombre">DeepSeek</span>
              <span class="flecha-empresa">›</span>
            </button>
          </div>
          <div class="menu-modelo-nivel" id="nivelModelos">
            <div class="nivel-modelos-header">
              <button type="button" class="volver-empresas-btn" onclick="mostrarNivelEmpresas()">
                <span>‹</span> <span id="tituloNivelModelos">Empresas</span>
              </button>
              <button type="button" class="selector-modelo-btn btn-esfuerzo-menu" id="btnEsfuerzo" onclick="toggleEsfuerzo()">
                <span id="txtEsfuerzo">Medio</span>
              </button>
            </div>
            <div class="grupo-modelos" id="grupo-claude">
              <button type="button" id="opcion-claude-sonnet-5" onclick="elegirModelo('claude-sonnet-5')">
                <span class="punto-modelo punto-claude"></span> Sonnet 5 <span class="etiqueta-modelo">código</span>
              </button>
              <button type="button" id="opcion-claude-sonnet-4-5" onclick="elegirModelo('claude-sonnet-4-5')">
                <span class="punto-modelo punto-claude"></span> Sonnet 4.5 <span class="etiqueta-modelo">código</span>
              </button>
              <button type="button" id="opcion-claude-opus-5" onclick="elegirModelo('claude-opus-5')">
                <span class="punto-modelo punto-claude"></span> Opus 5 <span class="etiqueta-modelo">complejo</span>
              </button>
              <button type="button" id="opcion-claude-fable-5-1" onclick="elegirModelo('claude-fable-5-1')">
                <span class="punto-modelo punto-claude"></span> Fable 5.1 <span class="etiqueta-modelo">difícil</span>
              </button>
            </div>
            <div class="grupo-modelos" id="grupo-deepseek">
              <button type="button" id="opcion-deepseek-v4-pro" onclick="elegirModelo('deepseek-v4-pro')">
                <span class="punto-modelo punto-deepseek"></span> V4 Pro <span class="etiqueta-modelo">charla</span>
              </button>
              <button type="button" id="opcion-deepseek-v4-flash" onclick="elegirModelo('deepseek-v4-flash')">
                <span class="punto-modelo punto-deepseek"></span> V4 Flash <span class="etiqueta-modelo">charla</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <span class="espaciador-flex"></span>
      <button id="voiceToggleBtn" class="voice-flat-btn" type="button" onclick="toggleVoz()"></button>
      <button id="sendBtn" class="mic-send-btn" type="button"></button>
    </div>
  </div>
</div>

<script>
  const ICONO_MIC = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="4" y1="9" x2="4" y2="15"/><line x1="9" y1="5" x2="9" y2="19"/><line x1="14" y1="2" x2="14" y2="22"/><line x1="19" y1="6" x2="19" y2="18"/></svg>`;
  const ICONO_ENVIAR = `<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M3 11.2L20.5 3l-7.8 18.5-2.3-7.6L3 11.2z"/></svg>`;
  const ICONO_VOZ_ON = `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.3 6a9 9 0 0 1 0 12"/></svg>`;
  const ICONO_VOZ_OFF = `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="16.5" y1="8.5" x2="21.5" y2="13.5"/><line x1="21.5" y1="8.5" x2="16.5" y2="13.5"/></svg>`;

  const WORKER_URL = "/api/chat"; // mismo origen: el propio Worker sirve esta página y atiende /api/chat
  const MODELO_KEY = "nova_modelo";
  const ESFUERZO_KEY = "nova_esfuerzo";

  const STORAGE_KEY = "chat_nova_codigo_historial"; // clave vieja, solo para migrar una vez
  const CONV_KEY = "nova_conversaciones";
  const ACTIVE_KEY = "nova_conversacion_activa";

  // ---- Fix de altura real de pantalla (evita el scroleo raro en celulares) ----
  // En el celular, "100vh" no es la altura que realmente se ve: no descuenta la barra
  // del navegador ni el teclado. Por eso calculamos la altura real acá y la guardamos
  // en la variable --vh, que el CSS usa en #app. Se recalcula cada vez que cambia
  // el tamaño visible (aparece/desaparece el teclado, gira el celular, etc).
  function fijarAlturaReal() {
    const alturaVisible = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--vh", (alturaVisible * 0.01) + "px");
  }
  fijarAlturaReal();
  window.addEventListener("resize", fijarAlturaReal);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fijarAlturaReal);
    window.visualViewport.addEventListener("scroll", fijarAlturaReal);
  }

  function generarId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function tituloDesdeHistorial(hist) {
    const primerUsuario = hist.find((m) => m.role === "user");
    if (!primerUsuario) return "Nueva conversación";
    let texto;
    if (typeof primerUsuario.content === "string") {
      texto = primerUsuario.content;
    } else {
      const bloque = primerUsuario.content.find((b) => b.type === "text");
      texto = bloque ? bloque.text : "Adjunto";
    }
    texto = (texto || "").trim();
    if (!texto) return "Nueva conversación";
    return texto.length > 40 ? texto.slice(0, 40) + "…" : texto;
  }

  function cargarConversaciones() {
    const raw = localStorage.getItem(CONV_KEY);
    if (raw) {
      try {
        return JSON.parse(raw);
      } catch (err) {
        return [];
      }
    }
    // Migración: si existía una sola conversación con el formato viejo, la convertimos
    const vieja = localStorage.getItem(STORAGE_KEY);
    if (vieja) {
      try {
        const hist = JSON.parse(vieja);
        if (Array.isArray(hist) && hist.length > 0) {
          return [{ id: generarId(), titulo: tituloDesdeHistorial(hist), actualizado: Date.now(), historial: hist }];
        }
      } catch (err) {}
    }
    return [];
  }

  let conversaciones = cargarConversaciones();
  let conversacionActivaId = localStorage.getItem(ACTIVE_KEY);
  if (!conversacionActivaId || !conversaciones.find((c) => c.id === conversacionActivaId)) {
    if (conversaciones.length === 0) {
      conversaciones.push({ id: generarId(), titulo: "Nueva conversación", actualizado: Date.now(), historial: [] });
    }
    conversacionActivaId = conversaciones[0].id;
    localStorage.setItem(ACTIVE_KEY, conversacionActivaId);
  }
  let historial = (conversaciones.find((c) => c.id === conversacionActivaId) || { historial: [] }).historial;
  // Pasos de cada respuesta de Nova (búsquedas, razonamiento), por posición en el historial.
  // Se guardan aparte para no mandarle a la API campos que no entiende.
  let pasosPorIndice = (conversaciones.find((c) => c.id === conversacionActivaId) || {}).pasos || {};

  // ---- Selector de modelo: Claude (Sonnet 5 / Sonnet 4.5) o DeepSeek (V4 Pro / V4 Flash) ----
  const ETIQUETAS_MODELO = {
    "claude-sonnet-5": "Sonnet 5",
    "claude-sonnet-4-5": "Sonnet 4.5",
    "claude-opus-5": "Opus 5",
    "claude-fable-5-1": "Fable 5.1",
    "deepseek-v4-pro": "DS V4 Pro",
    "deepseek-v4-flash": "DS V4 Flash",
  };
  const EMPRESA_DEL_MODELO = {
    "claude-sonnet-5": "claude",
    "claude-sonnet-4-5": "claude",
    "claude-opus-5": "claude",
    "claude-fable-5-1": "claude",
    "deepseek-v4-pro": "deepseek",
    "deepseek-v4-flash": "deepseek",
  };
  const NOMBRE_EMPRESA = { claude: "Anthropic", deepseek: "DeepSeek" };
  let modeloActual = ETIQUETAS_MODELO[localStorage.getItem(MODELO_KEY)] ? localStorage.getItem(MODELO_KEY) : "claude-sonnet-5";

  function actualizarBotonModelo() {
    const txt = document.getElementById("txtSelectorModelo");
    if (txt) txt.innerText = ETIQUETAS_MODELO[modeloActual] || "Claude";
    actualizarPastillaEsfuerzo();
    Object.keys(ETIQUETAS_MODELO).forEach((clave) => {
      const op = document.getElementById("opcion-" + clave);
      if (op) op.classList.toggle("activo", modeloActual === clave);
    });
  }

  function mostrarNivelEmpresas() {
    document.getElementById("nivelEmpresas").classList.add("activo");
    document.getElementById("nivelModelos").classList.remove("activo");
  }

  function mostrarModelosEmpresa(empresa) {
    document.getElementById("nivelEmpresas").classList.remove("activo");
    document.getElementById("nivelModelos").classList.add("activo");
    document.getElementById("grupo-claude").classList.toggle("activo", empresa === "claude");
    document.getElementById("grupo-deepseek").classList.toggle("activo", empresa === "deepseek");
    document.getElementById("tituloNivelModelos").innerText = NOMBRE_EMPRESA[empresa] || "Empresas";
    document.getElementById("btnEsfuerzo").classList.toggle("oculto", empresa !== "claude");
  }

  function toggleSelectorModelo() {
    const menu = document.getElementById("menuModelo");
    const seVaAbrir = !menu.classList.contains("abierto");
    menu.classList.toggle("abierto");
    if (seVaAbrir) {
      mostrarModelosEmpresa(EMPRESA_DEL_MODELO[modeloActual] || "claude");
    }
  }

  function cerrarSelectorModelo() {
    const menu = document.getElementById("menuModelo");
    if (menu) menu.classList.remove("abierto");
  }

  function elegirModelo(modelo) {
    modeloActual = modelo;
    try {
      localStorage.setItem(MODELO_KEY, modelo);
    } catch (err) {}
    actualizarBotonModelo();
    cerrarSelectorModelo();
  }

  document.addEventListener("click", (e) => {
    const wrap = document.getElementById("selectorModeloWrap");
    if (wrap && !wrap.contains(e.target)) cerrarSelectorModelo();
  });

  // ---- Nivel de esfuerzo para Claude: medio (default) o alto ----
  let esfuerzoActual = localStorage.getItem(ESFUERZO_KEY) === "alto" ? "alto" : "medio";

  function actualizarBotonEsfuerzo() {
    const txt = document.getElementById("txtEsfuerzo");
    if (txt) txt.innerText = esfuerzoActual === "alto" ? "Alto" : "Medio";
    actualizarPastillaEsfuerzo();
  }

  // En la pastilla del modelo, los modelos de Claude muestran también el esfuerzo (ej: "Sonnet 5 Medio")
  function actualizarPastillaEsfuerzo() {
    const esf = document.getElementById("txtEsfuerzoPastilla");
    if (!esf) return;
    const esClaude = EMPRESA_DEL_MODELO[modeloActual] === "claude";
    esf.innerText = esClaude ? (esfuerzoActual === "alto" ? "Alto" : "Medio") : "";
  }

  function toggleEsfuerzo() {
    esfuerzoActual = esfuerzoActual === "alto" ? "medio" : "alto";
    try {
      localStorage.setItem(ESFUERZO_KEY, esfuerzoActual);
    } catch (err) {}
    actualizarBotonEsfuerzo();
  }
  let adjuntosPendientes = [];

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  // ---- Estado visual del avatar de Nova (arriba de todo) ----
  // Estados posibles: "reposo", "escuchando", "pensando", "hablando", "codigo"
  const avatarNovaWrap = document.getElementById("avatarNovaWrap");
  const avatarNovaBadge = document.getElementById("avatarNovaBadge");

  const ICONOS_NOVA = {
    escuchando: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>',
    pensando: '<span style="display:flex;gap:1px;align-items:center;"><span style="width:2.5px;height:2.5px;border-radius:50%;background:currentColor;animation:novaPuntitos 1.2s infinite;animation-delay:0s;"></span><span style="width:2.5px;height:2.5px;border-radius:50%;background:currentColor;animation:novaPuntitos 1.2s infinite;animation-delay:.2s;"></span><span style="width:2.5px;height:2.5px;border-radius:50%;background:currentColor;animation:novaPuntitos 1.2s infinite;animation-delay:.4s;"></span></span>',
    hablando: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg>',
    codigo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/></svg>'
  };

  let estadoNovaActual = "reposo";
  function setEstadoNova(estado) {
    if (!avatarNovaWrap) return;
    if (estadoNovaActual === estado) return;
    estadoNovaActual = estado;
    avatarNovaWrap.className = "avatar-nova-wrap estado-" + estado;
    if (avatarNovaBadge) avatarNovaBadge.innerHTML = ICONOS_NOVA[estado] || "";
  }

  function guardarHistorial() {
    let conv = conversaciones.find((c) => c.id === conversacionActivaId);
    if (!conv) {
      conv = { id: conversacionActivaId || generarId(), titulo: "Nueva conversación", actualizado: Date.now(), historial: [] };
      conversacionActivaId = conv.id;
      localStorage.setItem(ACTIVE_KEY, conversacionActivaId);
      conversaciones.unshift(conv);
    }
    conv.historial = historial;
    conv.pasos = pasosPorIndice;
    conv.actualizado = Date.now();
    if (conv.titulo === "Nueva conversación") {
      conv.titulo = tituloDesdeHistorial(historial);
    }
    try {
      localStorage.setItem(CONV_KEY, JSON.stringify(conversaciones));
    } catch (err) {
      console.warn("No se pudo guardar el historial (puede estar lleno por adjuntos pesados):", err);
    }
  }

  function abrirHistorialPanel() {
    renderizarListaConversaciones();
    document.getElementById("overlayHistorial").classList.add("abierto");
    document.getElementById("panelHistorial").classList.add("abierto");
  }

  function cerrarHistorialPanel() {
    document.getElementById("overlayHistorial").classList.remove("abierto");
    document.getElementById("panelHistorial").classList.remove("abierto");
  }

  // ---- Panel de Memoria ----
  function abrirMemoriaPanel() {
    document.getElementById("overlayMemoria").classList.add("abierto");
    document.getElementById("panelMemoria").classList.add("abierto");
    cargarMemoria();
  }

  function cerrarMemoriaPanel() {
    document.getElementById("overlayMemoria").classList.remove("abierto");
    document.getElementById("panelMemoria").classList.remove("abierto");
  }

  async function cargarMemoria() {
    const lista = document.getElementById("listaMemoria");
    lista.innerHTML = `<div class="vacio-conversaciones">Cargando...</div>`;
    try {
      const res = await fetch("/api/memoria");
      const data = await res.json();
      if (!res.ok) {
        lista.innerHTML = `<div class="vacio-conversaciones">Error: ${data.error || "no se pudo cargar la memoria."}</div>`;
        return;
      }
      const notas = data.notas || [];
      if (notas.length === 0) {
        lista.innerHTML = `<div class="vacio-conversaciones">Todavía no le pediste a Nova que recuerde nada.</div>`;
        return;
      }
      lista.innerHTML = "";
      notas.forEach((nota, i) => {
        const item = document.createElement("div");
        item.className = "item-nota";
        item.innerHTML = `<span class="texto-nota"></span><span class="borrar-conv">✕</span>`;
        item.querySelector(".texto-nota").textContent = nota;
        item.querySelector(".borrar-conv").onclick = () => eliminarNotaMemoria(i);
        lista.appendChild(item);
      });
    } catch (err) {
      lista.innerHTML = `<div class="vacio-conversaciones">No se pudo cargar la memoria: ${err.message}</div>`;
    }
  }

  async function agregarNotaMemoria() {
    const input = document.getElementById("inputNotaMemoria");
    const texto = input.value.trim();
    if (!texto) return;
    input.value = "";
    try {
      const res = await fetch("/api/memoria", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nota: texto }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert("No se pudo guardar la nota: " + (data.error || res.status));
        return;
      }
      cargarMemoria();
    } catch (err) {
      alert("No se pudo guardar la nota: " + err.message);
    }
  }

  async function eliminarNotaMemoria(indice) {
    try {
      const res = await fetch("/api/memoria", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ indice: indice }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert("No se pudo borrar la nota: " + (data.error || res.status));
        return;
      }
      cargarMemoria();
    } catch (err) {
      alert("No se pudo borrar la nota: " + err.message);
    }
  }

  function renderizarListaConversaciones() {
    const cont = document.getElementById("listaConversaciones");
    cont.innerHTML = "";
    const ordenadas = [...conversaciones].sort((a, b) => {
      if (!!b.fijado !== !!a.fijado) return (b.fijado ? 1 : 0) - (a.fijado ? 1 : 0);
      return b.actualizado - a.actualizado;
    });
    if (ordenadas.length === 0) {
      cont.innerHTML = '<div class="vacio-conversaciones">Sin conversaciones todavía.</div>';
      return;
    }
    ordenadas.forEach((conv) => {
      const item = document.createElement("div");
      item.className = "item-conversacion" + (conv.id === conversacionActivaId ? " activa" : "");
      const spanTitulo = document.createElement("span");
      spanTitulo.className = "titulo-conv";
      spanTitulo.innerText = (conv.fijado ? "📌 " : "") + (conv.titulo || "Nueva conversación");
      spanTitulo.onclick = () => seleccionarConversacion(conv.id);
      const spanBorrar = document.createElement("span");
      spanBorrar.className = "borrar-conv";
      spanBorrar.innerText = "✕";
      spanBorrar.onclick = (e) => {
        e.stopPropagation();
        borrarConversacion(conv.id);
      };
      item.appendChild(spanTitulo);
      item.appendChild(spanBorrar);
      cont.appendChild(item);
    });
  }

  function seleccionarConversacion(id) {
    conversacionActivaId = id;
    localStorage.setItem(ACTIVE_KEY, id);
    const conv = conversaciones.find((c) => c.id === id);
    historial = conv ? conv.historial : [];
    pasosPorIndice = (conv && conv.pasos) || {};
    inputEl.value = "";
    inputEl.style.height = "auto";
    adjuntosPendientes = [];
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    pintarHistorialCompleto();
    renderizarAdjuntosPendientes();
    cerrarHistorialPanel();
  }

  function crearConversacionNueva() {
    const conv = { id: generarId(), titulo: "Nueva conversación", actualizado: Date.now(), historial: [] };
    conversaciones.unshift(conv);
    try {
      localStorage.setItem(CONV_KEY, JSON.stringify(conversaciones));
    } catch (err) {}
    seleccionarConversacion(conv.id);
  }

  function borrarConversacion(id) {
    if (!confirm("¿Borrar esta conversación?")) return;
    conversaciones = conversaciones.filter((c) => c.id !== id);
    try {
      localStorage.setItem(CONV_KEY, JSON.stringify(conversaciones));
    } catch (err) {}
    if (id === conversacionActivaId) {
      if (conversaciones.length === 0) {
        crearConversacionNueva();
      } else {
        seleccionarConversacion(conversaciones[0].id);
      }
    } else {
      renderizarListaConversaciones();
    }
  }

  // ---- Menú de tres puntitos: Compartir, Renombrar, Fijar, Limpiar, Eliminar ----

  function toggleMenuOpciones() {
    actualizarBotonFijar();
    actualizarBotonCharla();
    document.getElementById("menuOpciones").classList.toggle("abierto");
  }
  function cerrarMenuOpciones() {
    document.getElementById("menuOpciones").classList.remove("abierto");
  }
  document.addEventListener("click", (e) => {
    const menu = document.getElementById("menuOpciones");
    const btn = document.querySelector(".menu-opciones-btn");
    if (menu && menu.classList.contains("abierto") && !menu.contains(e.target) && e.target !== btn) {
      menu.classList.remove("abierto");
    }
  });

  function actualizarBotonFijar() {
    const conv = conversaciones.find((c) => c.id === conversacionActivaId);
    const txt = document.getElementById("txtFijar");
    if (txt) txt.innerText = conv && conv.fijado ? "Desfijar" : "Fijar";
  }

  function actualizarBotonCharla() {
    const txt = document.getElementById("txtCharla");
    if (txt) txt.innerText = modoConversacion ? "Modo Charla: activado" : "Modo Charla";
  }

  function alternarFijado() {
    const conv = conversaciones.find((c) => c.id === conversacionActivaId);
    if (!conv) return;
    conv.fijado = !conv.fijado;

      localStorage.setItem(CONV_KEY, JSON.stringify(conversaciones));

  function compartirConversacion() {
    const conv = conversaciones.find((c) => c.id === conversacionActivaId);
    cerrarMenuOpciones();
    if (!conv) return;
    const texto = (conv.historial || [])
      .map((m) => {

          typeof m.content === "string"
            ? m.content
            : m.content.filter((b) => b.type === "text").map((b) => b.text).join(" ");
        return `${quien}: ${contenido}`;
